name: Making a backup

on:
  schedule:
    - cron: '0 0 * * *' # Запускать каждый день в полночь UTC
  push:
    paths:
      - ".github/workflows/backup.yml"
      - "Makefile"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup-db:
    name: "Бекап БД"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "Подготовка репозитория"
        uses: actions/checkout@v4

      - name: "Снимем дамп БД"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd ${{ vars.PROJECT_PATH }}
            make backup-db

  backup-file:
    name: "Бекап файлов"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "Подготовка репозитория"
        uses: actions/checkout@v4

      - name: "Создаём архив"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd ${{ vars.PROJECT_PATH }}
            make backup-file

  backup-prune:
    name: "Ротация бэкапов"
    runs-on: ubuntu-latest
    environment: production
    needs: [ backup-file, backup-db ]
    steps:
      - name: "Подготовка репозитория"
        uses: actions/checkout@v4

      - name: "Удалим бэкапы rem_it_bot старше 7 дней"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            cd ${{ vars.PROJECT_PATH }}
            make backup-prune

  alert:
    name: "Уведомление"
    runs-on: ubuntu-latest
    needs: [ backup-file, backup-db, backup-prune ]
    steps:
      - name: "Отправим сообщение через телеграм"
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Бекап проекта ${{ github.repository }} сделан. Хранение 7 дней.
